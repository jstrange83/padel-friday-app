<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afmeld nyhedsbrev – Padelklubben</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c1b2a;--card:#12283d;--text:#e8eef5;--muted:#a9b8c8;--accent:#c6ef3e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 16px 64px;text-align:center}img{width:64px;height:64px;border-radius:16px}
h1{font-size:26px;margin:14px 0 6px}.card{background:var(--card);border-radius:18px;padding:22px 18px;margin:18px 0}
.muted{color:var(--muted)}a{color:var(--accent)}
button{font:inherit;font-weight:700;background:var(--accent);color:#0c1b2a;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;min-width:200px}
button:disabled{opacity:.6}
</style></head><body><main>
<img src="/icon-192.png" alt="">
<h1>Afmeld nyhedsbrev</h1>
<div class="card" id="box"><p>Vil du ikke længere have nyhedsbreve på mail fra denne gruppe eller klub?</p><button id="go">Afmeld</button></div>
<p class="muted small">Du får stadig vigtige beskeder om dine spilledage og træninger. Du kan altid slå nyhedsbreve til igen i appen under <b>Min padel → ⚙️ → Notifikationer og mails</b>.</p>
<p><a href="/">Åbn Padelklubben</a></p>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://jlstsyvhlzsbqymwiyzx.supabase.co', 'sb_publishable_rvPBZIkE1qhyrsq2o4EVYw_-afl7UyZ', { auth: { persistSession: false } });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = new URLSearchParams(location.search).get('t');
const box = document.getElementById('box');
if (!t) box.innerHTML = '<p>Linket mangler en del. Prøv at trykke på linket i mailen igen.</p>';
else document.getElementById('go').onclick = async (e) => {
  e.target.disabled = true;
  const { data, error } = await sb.rpc('padel_newsletter_unsubscribe_v2', { p_token: t });
  if (error) { e.target.disabled = false; box.insertAdjacentHTML('beforeend', '<p class="muted">Det lykkedes ikke. Prøv igen om lidt.</p>'); return; }
  box.innerHTML = data ? `<p>✅ Du er afmeldt nyhedsbreve fra <b>${esc(data)}</b>.</p>` : '<p>Linket virker ikke længere. Du kan slå nyhedsbreve fra i appen.</p>';
};
</script></body></html>
