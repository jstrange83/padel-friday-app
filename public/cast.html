<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vis på TV – Padelklubben</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c1b2a;--card:#12283d;--text:#e8eef5;--muted:#a9b8c8;--accent:#c6ef3e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px 64px;text-align:center}
.ic{font-size:56px}h1{font-size:26px;margin:6px 0}.card{background:var(--card);border-radius:18px;padding:22px 18px;margin:18px 0}
.muted{color:var(--muted)}a{color:var(--accent)}
button{font:inherit;font-weight:800;font-size:19px;background:var(--accent);color:#0c1b2a;border:0;border-radius:14px;padding:16px 22px;width:100%;cursor:pointer}
button:disabled{opacity:.6}.sec{display:block;margin-top:14px}
</style></head><body><main>
<div class="ic">📺</div>
<h1>Vis spilledagen på TV</h1>
<div class="card" id="box">
  <button id="go">📡 Cast til TV</button>
  <p class="muted" id="note">Vælg dit TV på listen. Det skal have Chromecast eller Google TV og være på samme wifi som telefonen.</p>
</div>
<p><a href="#" id="open" class="sec">🖥 Åbn TV-skærmen her i stedet</a></p>
<p class="muted">Når dagen vises på TV'et, kan du gå tilbage til appen. TV'et opdaterer sig selv.</p>
</main>
<script>
// Kommer fra appen: ?u= er linket til TV-skærmen. Kun links til vores egne TV-sider godtages.
const raw = new URLSearchParams(location.search).get('u') || '';
let url = null;
try { const x = new URL(raw, location.origin); if (/^\/tv(\/|\.html)/.test(x.pathname) && /(^|\.)padelklubben\.dk$|padel-friday-app\.vercel\.app$/.test(x.hostname)) url = x.href; } catch {}
const box = document.getElementById('box'), note = document.getElementById('note');
document.getElementById('open').onclick = (e) => { e.preventDefault(); if (url) location.href = url; };
if (!url) { box.innerHTML = '<p>Linket mangler en del. Gå tilbage til appen og tryk på TV-knappen igen.</p>'; }
else if (!('PresentationRequest' in window)) { box.innerHTML = '<p>Denne browser kan ikke caste. Åbn siden i <b>Chrome</b>, eller brug "Åbn TV-skærmen her" på en computer, der er sluttet til TV\'et.</p>'; }
else {
  const req = new PresentationRequest([url]);
  req.getAvailability?.().then((a) => { const upd = () => { if (!a.value) note.textContent = 'Der er ikke fundet noget TV endnu. Tjek at TV\'et er tændt og på samme wifi. Du kan stadig prøve.'; }; upd(); a.onchange = upd; }).catch(() => {});
  document.getElementById('go').onclick = async (e) => {
    e.target.disabled = true;
    try {
      const c = await req.start();
      box.innerHTML = '<p>✅ Dagen vises nu på TV\'et. Du kan gå tilbage til appen.</p><button id="stop">Stop visning</button>';
      document.getElementById('stop').onclick = () => { try { c.terminate(); } catch {} box.innerHTML = '<p>Visningen er stoppet.</p>'; };
    } catch (err) { e.target.disabled = false; if (err && err.name !== 'AbortError' && err.name !== 'NotAllowedError') note.textContent = 'Det lykkedes ikke at caste. Prøv igen, eller åbn TV-skærmen her.'; }
  };
}
</script></body></html>
