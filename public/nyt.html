<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyt og på vej – Padelklubben</title>
<meta name="description" content="Se hvad vi arbejder på i Padelklubben-appen, og hvad der kommer.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c1b2a;--card:#12283d;--text:#e8eef5;--muted:#a9b8c8;--accent:#c6ef3e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header img{width:56px;height:56px;border-radius:14px}h1{font-size:28px;margin:0}h2{font-size:19px;margin:26px 0 8px}
.muted{color:var(--muted)}section{background:var(--card);border-radius:16px;padding:14px 18px;margin:10px 0}
section b{display:block}section p{margin:4px 0 0;color:var(--muted);font-size:15px}.votes{font-size:13px;color:var(--accent)}
a{color:var(--accent)}footer{margin-top:28px;font-size:14px}
</style></head><body><main>
<header><img src="/icon-192.png" alt=""><div><h1>Nyt og på vej</h1><div class="muted">Padelklubben-appen</div></div></header>
<p>Her kan du se, hvad vi arbejder på lige nu, og hvad der er på tegnebrættet. Er du med i appen, kan du stemme på det, du gerne vil have, under <b>Profil → Nyt og på vej</b>.</p>
<div id="list"><p class="muted">Henter…</p></div>
<footer class="muted"><a href="/">Åbn Padelklubben</a> · <a href="/support">Hjælp og kontakt</a> · <a href="/privatliv">Privatliv</a></footer>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://jlstsyvhlzsbqymwiyzx.supabase.co', 'sb_publishable_rvPBZIkE1qhyrsq2o4EVYw_-afl7UyZ', { auth: { persistSession: false } });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = document.getElementById('list');
const { data, error } = await sb.rpc('padel_roadmap_public_v2');
if (error) { el.innerHTML = '<p class="muted">Listen kunne ikke hentes lige nu. Prøv igen om lidt.</p>'; }
else {
  const part = (st, t, empty) => { const xs = data.filter((r) => r.status === st); return `<h2>${t}</h2>${xs.map((r) => `<section><b>${esc(r.title)}</b>${r.body ? `<p>${esc(r.body)}</p>` : ''}${r.votes && st !== 'bygget' ? `<span class="votes">👍 ${r.votes}</span>` : ''}</section>`).join('') || `<p class="muted">${empty}</p>`}`; };
  el.innerHTML = part('igang', '🔨 I gang', 'Intet lige nu.') + part('plan', '💡 På tegnebrættet', 'Ingen punkter endnu.') + part('bygget', '✅ Senest bygget', 'Se nyhederne i appen under Profil → Nyt og på vej.');
}
</script></body></html>
