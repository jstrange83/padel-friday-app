name: App Store side (iPhone)

# Lægger tekster, skærmbilleder og kontakt til Apple op i App Store Connect og vælger nyeste byg.
# Sender ikke til godkendelse. Startes manuelt (Actions → App Store side → Run workflow).
# Adgangskoden til demo-kontoen ligger kun i App Store Connect, ikke her.
on:
  workflow_dispatch:
    inputs:
      only_review:
        description: 'Kun noter og kontakt til Apple (1 = ja)'
        default: '0'
      video_url:
        description: 'Link til skærmoptagelsen'
        default: ''

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "pyjwt[crypto]" requests
      - run: python scripts/asc_listing.py
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ONLY_REVIEW: ${{ inputs.only_review }}
          VIDEO_URL: ${{ inputs.video_url }}
