name: Android app (test-APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer Capacitor
        working-directory: native
        run: npm ci && npx cap sync android
      - name: Byg APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: padelklubben-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Læg APK på hjemmesiden (public/app)
        run: |
          mkdir -p public/app
          cp native/android/app/build/outputs/apk/debug/app-debug.apk public/app/padelklubben.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/padelklubben.apk
          git commit -m "Ny test-APK af Padelklubben-appen" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
